name: Publish Skills to Skill Hubs

# GitHub is the single source of truth. This workflow distributes the skills
# to ClawHub and SkillHub.
#
# Trigger:
#   - push a `v*` tag (`git tag v* && git push --tags`) -> runs directly.
#     This is the primary path. It intentionally does NOT depend on the
#     `release` event chain: releases created by release.yml use the default
#     GITHUB_TOKEN, and GITHUB_TOKEN-triggered events do not start new
#     workflow runs (GitHub limitation). Listening to `push.tags` avoids that.
#   - `release` published -> fallback for releases created manually in the UI.
#   - workflow_dispatch -> manual run for debugging.
#
# Required repository secrets:
#   - CLAWHUB_TOKEN   : ClawHub token (or run `clawhub login` locally and use
#                       workflow_dispatch after configuring the CLI)
#   - CLAWHUB_OWNER   : optional, ClawHub owner to publish as
#   - SKILLHUB_API_KEY: SkillHub API key
#
# A step is skipped when its secret is not configured, so the workflow is safe
# to add even before all tokens exist.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-hubs:
    runs-on: ubuntu-latest
    env:
      # Tag name used in the changelog. On `push tags` this is ref_name; on
      # `release` events it's the release tag; manual runs fall back to ref_name.
      TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ClawHub publishes first, before the SkillHub CLI install, so a SkillHub
      # install failure never blocks the ClawHub release.
      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Publish to ClawHub
        if: ${{ secrets.CLAWHUB_TOKEN != '' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_OWNER: ${{ secrets.CLAWHUB_OWNER }}
        run: |
          bash scripts/publish-clawhub.sh --publish \
            --changelog "Release $TAG_NAME"

      - name: Install SkillHub CLI
        if: ${{ secrets.SKILLHUB_API_KEY != '' }}
        run: |
          curl -fsSL https://skillhub-1388575217.cos.ap-guangzhou.myqcloud.com/install/install.sh | bash -s -- --cli-only

      - name: Publish to SkillHub
        if: ${{ secrets.SKILLHUB_API_KEY != '' }}
        env:
          SKILLHUB_API_KEY: ${{ secrets.SKILLHUB_API_KEY }}
        run: |
          bash scripts/publish-skillhub.sh --publish \
            --changelog "Release $TAG_NAME"
