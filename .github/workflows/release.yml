name: Release Skills Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create skills zip package
        run: |
          cd skills
          zip -r "../seo-signal-skills-${{ steps.version.outputs.VERSION }}.zip" \
              research-seo-signals/ \
              research-social-signals/ \
              decide-content-opportunities/ \
              -x "*.DS_Store"

      - name: Generate Release Body
        run: |
          # 获取上一个 tag（如果有）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          cat > /tmp/release_body.md << 'BODYEOF'
          BODYEOF

          {
            echo "## Release ${{ steps.version.outputs.VERSION }}"
            echo ""
            echo "### 📋 变更日志 (Changelog)"
            echo ""
            echo "${CHANGELOG}"
            echo ""
            echo "### 包含技能 (Included Skills)"
            echo ""
            echo "- **research-seo-signals** - SEO 信号研究与数据采集"
            echo "- **research-social-signals** - 社交媒体信号监听 (支持 X/Reddit/知乎/地域热点)"
            echo "- **decide-content-opportunities** - 内容机会决策建议"
            echo ""
            echo "### 安装 (Installation)"
            echo ""
            echo "解压后将 skills 子文件夹链接到您的 AI 客户端："
            echo ""
            echo '```bash'
            echo "# Claude Code 示例"
            echo 'ln -s "$(pwd)/research-seo-signals" ~/.claude/skills/'
            echo 'ln -s "$(pwd)/research-social-signals" ~/.claude/skills/'
            echo 'ln -s "$(pwd)/decide-content-opportunities" ~/.claude/skills/'
            echo '```'
            echo ""
            echo "### MCP 配置 (MCP Configuration)"
            echo ""
            echo "请参考 [README.md](https://github.com/daily-growth-signals/seo-signal-skills/blob/main/README.md) 配置 MCP 服务。"
          } >> /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SEO Signal Skills ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release_body.md
          files: seo-signal-skill*.zip
          draft: false
          prerelease: false
