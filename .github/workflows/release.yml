name: Release Skills Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create skills zip package
        run: |
          cd skills
          zip -r "../seo-signal-skills-${{ steps.version.outputs.VERSION }}.zip" \
              research-seo-signals/ \
              research-social-signals/ \
              decide-content-opportunities/ \
              -x "*.DS_Store"

      - name: Generate Release Body
        run: |
          # 获取上一个 tag（如果有）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges > /tmp/changelog.txt
          else
            git log --pretty=format:"- %s (%h)" --no-merges -20 > /tmp/changelog.txt
          fi

          {
            printf "## Release %s\n\n" "${{ steps.version.outputs.VERSION }}"
            printf "### 📋 变更日志 (Changelog)\n\n"
            cat /tmp/changelog.txt
            printf "\n"
            printf "### 包含技能 (Included Skills)\n\n"
            printf "- **research-seo-signals** - SEO 信号研究与数据采集\n"
            printf "- **research-social-signals** - 社交媒体信号监听 (支持 X/Reddit/知乎/地域热点)\n"
            printf "- **decide-content-opportunities** - 内容机会决策建议\n"
            printf "\n"
            printf "### 安装 (Installation)\n\n"
            printf "解压后将 skills 子文件夹链接到您的 AI 客户端：\n\n"
            printf '```bash\n'
            printf "# Claude Code 示例\n"
            printf 'ln -s "$(pwd)/research-seo-signals" ~/.claude/skills/\n'
            printf 'ln -s "$(pwd)/research-social-signals" ~/.claude/skills/\n'
            printf 'ln -s "$(pwd)/decide-content-opportunities" ~/.claude/skills/\n'
            printf '```\n'
            printf "\n"
            printf "### MCP 配置 (MCP Configuration)\n\n"
            printf "请参考 [README.md](https://github.com/daily-growth-signals/seo-signal-skills/blob/main/README.md) 配置 MCP 服务。\n"
          } > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SEO Signal Skills ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release_body.md
          files: seo-signal-skill*.zip
          draft: false
          prerelease: false
